name: Deploy Moneta Catat Cuan to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: money-tracker/package-lock.json

      - name: Install dependencies
        working-directory: money-tracker
        run: npm ci

      - name: Run ESLint
        working-directory: money-tracker
        run: npm run lint

      - name: Build static export for GitHub Pages
        working-directory: money-tracker
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Add .nojekyll for Next.js _next assets
        run: touch money-tracker/out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: money-tracker/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
